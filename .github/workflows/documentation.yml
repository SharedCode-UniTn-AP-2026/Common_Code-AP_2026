
name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test documentation examples
        run: cargo test --workspace --doc

      - name: Generate Rust documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Create documentation homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("target/doc")
          target = "ap_2026_common_code"

          if not (root / target / "index.html").is_file():
              raise SystemExit(f"Documentation not found: {target}")

          (root / "index.html").write_text(
              """<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=ap_2026_common_code/">
            <link rel="canonical" href="ap_2026_common_code/">
            <title>Project Documentation</title>
          </head>
          <body>
            <p>
              Redirecting to
              <a href="ap_2026_common_code/">Project Documentation</a>...
            </p>
          </body>
          </html>
          """,
              encoding="utf-8",
          )
          PY

      - name: Prepare GitHub Pages
        run: touch target/doc/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload documentation
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

      - name: Deploy documentation
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

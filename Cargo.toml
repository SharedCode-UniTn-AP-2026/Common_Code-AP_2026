[package]
name = "ap-2026-common-code"
version = "0.1.0"
edition = "2024"

[dependencies]
geometry = { package = "ap-2026-common-code-geometry", path = "src/geometry" }
shared = { package = "ap-2026-common-code-shared", path = "src/shared" }

[workspace]
members = [
    "src/geometry",
    "src/shared"
]

[workspace.dependencies]
shared = { package = "ap-2026-common-code-shared", path = "src/shared", version = "0.1.0" }
